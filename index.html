<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meds 2 Beds — Discharge Dashboard</title>
<style>
  :root {
    --clr-bg: #f5f4f0;
    --clr-surface: #ffffff;
    --clr-surface2: #f0efe9;
    --clr-border: #dddbd2;
    --clr-text: #1a1917;
    --clr-muted: #6b6960;
    --clr-accent: #185fa5;
    --clr-accent-bg: #e6f1fb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --clr-bg: #1a1917;
      --clr-surface: #242320;
      --clr-surface2: #2c2c29;
      --clr-border: #3a3936;
      --clr-text: #f0efe9;
      --clr-muted: #9c9b94;
      --clr-accent: #5b9fd4;
      --clr-accent-bg: #0c3558;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--clr-bg);
    color: var(--clr-text);
    font-size: 14px;
    min-height: 100vh;
  }

  .topbar {
    background: var(--clr-surface);
    border-bottom: 1px solid var(--clr-border);
    padding: 0 20px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.5px; color: var(--clr-text); }
  .logo span { color: var(--clr-accent); }
  .shift-badge {
    font-size: 11px;
    font-weight: 600;
    background: var(--clr-accent-bg);
    color: var(--clr-accent);
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--clr-muted); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #3B6D11; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--clr-border);
    border-bottom: 1px solid var(--clr-border);
  }
  .summary-card {
    background: var(--clr-surface);
    padding: 12px 16px;
    text-align: center;
  }
  .summary-card .num { font-size: 26px; font-weight: 700; line-height: 1; }
  .summary-card .lbl { font-size: 11px; color: var(--clr-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
  .num-total { color: var(--clr-text); }
  .num-active { color: #185fa5; }
  .num-delivered { color: #3B6D11; }
  .num-problem { color: #A32D2D; }
  .num-nextday { color: #5F5E5A; }

  .main { display: flex; height: calc(100vh - 54px - 61px); overflow: hidden; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--clr-surface);
    border-right: 1px solid var(--clr-border);
    overflow-y: auto;
    padding: 12px 0;
  }

  .sidebar-section-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--clr-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 10px 14px 4px;
  }

  .floor-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 7px 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--clr-text);
    text-align: left;
    transition: background 0.1s;
  }
  .floor-btn:hover { background: var(--clr-surface2); }
  .floor-btn.active { background: var(--clr-accent-bg); color: var(--clr-accent); font-weight: 600; }
  .floor-count {
    font-size: 11px;
    background: var(--clr-surface2);
    color: var(--clr-muted);
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 600;
  }
  .floor-btn.active .floor-count { background: var(--clr-accent); color: #fff; }

  .filter-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 12px;
    color: var(--clr-muted);
    text-align: left;
    transition: color 0.1s;
  }
  .filter-btn:hover { color: var(--clr-text); }
  .filter-btn.active { color: var(--clr-accent); font-weight: 600; }
  .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type="text"] {
    flex: 1;
    min-width: 180px;
    padding: 7px 12px;
    border: 1px solid var(--clr-border);
    border-radius: 6px;
    background: var(--clr-surface);
    color: var(--clr-text);
    font-size: 13px;
    outline: none;
  }
  .toolbar input:focus { border-color: var(--clr-accent); }

  .btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--clr-border);
    background: var(--clr-surface);
    color: var(--clr-text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--clr-surface2); }
  .btn-primary { background: var(--clr-accent); color: #fff; border-color: var(--clr-accent); }
  .btn-primary:hover { opacity: 0.88; }

  .table-wrap {
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: 14px;
    overflow: hidden;
  }

  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--clr-border);
    background: var(--clr-surface2);
  }
  .table-header-title { font-size: 13px; font-weight: 600; }
  .table-header-count { font-size: 12px; color: var(--clr-muted); }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--clr-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 12px;
    background: var(--clr-surface2);
    border-bottom: 1px solid var(--clr-border);
  }
  tbody tr { border-bottom: 1px solid var(--clr-border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--clr-surface2); }
  tbody td { padding: 9px 12px; vertical-align: middle; }

  .col-patient { width: 19%; }
  .col-floor { width: 12%; }
  .col-called { width: 10%; }
  .col-status { width: 14%; }
  .col-delivery { width: 12%; }
  .col-deliverer { width: 11%; }
  .col-notes { width: auto; }
  .col-actions { width: 72px; }

  .patient-name { font-weight: 600; font-size: 13px; }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .note-text { font-size: 12px; color: var(--clr-muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-alert { color: #A32D2D; font-weight: 600; }

  .editable-select {
    appearance: none;
    border: none;
    background: transparent;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    outline: 1px solid transparent;
    transition: outline 0.1s;
    width: 100%;
  }
  .editable-select:hover { outline: 1px solid var(--clr-border); }
  .editable-select:focus { outline: 2px solid var(--clr-accent); }

  .action-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--clr-border);
    background: var(--clr-surface);
    cursor: pointer;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
  .action-btn:hover { background: var(--clr-surface2); }
  .action-btn.danger:hover { background: #FCEBEB; border-color: #F09595; }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--clr-surface);
    border-radius: 14px;
    border: 1px solid var(--clr-border);
    width: 520px;
    max-width: 96vw;
    padding: 24px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal-field { display: flex; flex-direction: column; gap: 5px; }
  .modal-field.full { grid-column: 1 / -1; }
  .modal-field label { font-size: 11px; font-weight: 700; color: var(--clr-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-field input, .modal-field select, .modal-field textarea {
    padding: 8px 10px;
    border: 1px solid var(--clr-border);
    border-radius: 6px;
    background: var(--clr-bg);
    color: var(--clr-text);
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color: var(--clr-accent); }
  .modal-field textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: #1a1917;
    color: #f0efe9;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    z-index: 300;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .floor-group-header {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--clr-muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    background: var(--clr-surface2);
    border-bottom: 1px solid var(--clr-border);
  }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--clr-muted); font-size: 14px; }

  @media (max-width: 800px) {
    .main { flex-direction: column; height: auto; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--clr-border); }
    .summary-strip { grid-template-columns: repeat(3, 1fr); }
    .col-deliverer, .col-delivery { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">Meds<span>2</span>Beds</span>
    <span class="shift-badge" id="shiftBadge">Day Shift</span>
  </div>
  <div class="topbar-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span id="clockDisplay">—</span>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Patient</button>
  </div>
</div>

<div class="summary-strip">
  <div class="summary-card"><div class="num num-total" id="sumTotal">0</div><div class="lbl">Total Active</div></div>
  <div class="summary-card"><div class="num num-active" id="sumInProgress">0</div><div class="lbl">In Progress</div></div>
  <div class="summary-card"><div class="num num-delivered" id="sumDelivered">0</div><div class="lbl">Delivered</div></div>
  <div class="summary-card"><div class="num num-problem" id="sumProblem">0</div><div class="lbl">Problems</div></div>
  <div class="summary-card"><div class="num num-nextday" id="sumNextDay">0</div><div class="lbl">Next Day D/C</div></div>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-section-title">Floors</div>
    <button class="floor-btn active" data-floor="All" onclick="setFloor('All', this)">
      All Floors <span class="floor-count" id="fcAll">0</span>
    </button>
    <div id="floorButtons"></div>

    <div class="sidebar-section-title" style="margin-top:8px;">Filter by Status</div>
    <button class="filter-btn active" data-status="All" onclick="setStatusFilter('All', this)">
      <span class="filter-dot" style="background:var(--clr-muted)"></span> All statuses
    </button>
    <button class="filter-btn" data-status="Problem/Issue" onclick="setStatusFilter('Problem/Issue', this)">
      <span class="filter-dot" style="background:#E24B4A"></span> Problem / Issue
    </button>
    <button class="filter-btn" data-status="In the Works !!!" onclick="setStatusFilter('In the Works !!!', this)">
      <span class="filter-dot" style="background:#E24B4A"></span> Urgent
    </button>
    <button class="filter-btn" data-status="Delivered" onclick="setStatusFilter('Delivered', this)">
      <span class="filter-dot" style="background:#3B6D11"></span> Delivered
    </button>
    <button class="filter-btn" data-status="Next Day d/c" onclick="setStatusFilter('Next Day d/c', this)">
      <span class="filter-dot" style="background:#888780"></span> Next Day D/C
    </button>
    <button class="filter-btn" data-status="Meds To Go" onclick="setStatusFilter('Meds To Go', this)">
      <span class="filter-dot" style="background:#185fa5"></span> Meds To Go
    </button>

    <div class="sidebar-section-title" style="margin-top:8px;">Called Filter</div>
    <button class="filter-btn" data-called="NO" onclick="setCalledFilter('NO', this)">
      <span class="filter-dot" style="background:#E24B4A"></span> Not Called
    </button>
    <button class="filter-btn" data-called="ATTEMPTED" onclick="setCalledFilter('ATTEMPTED', this)">
      <span class="filter-dot" style="background:#BA7517"></span> Attempted
    </button>
    <button class="filter-btn" data-called="All" onclick="setCalledFilter('All', this)">
      <span class="filter-dot" style="background:var(--clr-muted)"></span> All
    </button>
  </aside>

  <div class="content">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search patient, floor, notes..." oninput="renderTable()">
      <button class="btn" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn" onclick="if(confirm('Clear all patients?')){patients=[];saveData();renderAll();}">🗑 Clear All</button>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <span class="table-header-title">Active Discharges</span>
        <span class="table-header-count" id="tableCount">0 patients</span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th class="col-patient">Patient</th>
              <th class="col-floor">Floor</th>
              <th class="col-called">Called?</th>
              <th class="col-status">Status</th>
              <th class="col-delivery">Delivery</th>
              <th class="col-deliverer">Deliverer</th>
              <th class="col-notes">Notes</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">No patients match your current filters.</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Patient</h2>
    <div class="modal-grid">
      <div class="modal-field full">
        <label>Patient Name</label>
        <input type="text" id="mName" placeholder="Last, First">
      </div>
      <div class="modal-field">
        <label>Floor</label>
        <select id="mFloor"></select>
      </div>
      <div class="modal-field">
        <label>Called Patient?</label>
        <select id="mCalled">
          <option value="">—</option>
          <option>YES</option>
          <option>NO</option>
          <option>ATTEMPTED</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Queue / Status</label>
        <select id="mStatus"></select>
      </div>
      <div class="modal-field">
        <label>Delivery</label>
        <select id="mDelivery"></select>
      </div>
      <div class="modal-field">
        <label>Deliverer</label>
        <select id="mDeliverer"></select>
      </div>
      <div class="modal-field full">
        <label>Notes</label>
        <textarea id="mNotes" placeholder="Special instructions, alerts, timing..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePatient()">Save Patient</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FLOORS = ['Baird 3','Baird 4','Baird 5','Baird 6','Baird 7','Miller 3','Miller 4','Miller 5','Miller 6','McClure 3','McClure 4','McClure 5','McClure 6','Shep','ED','ED/ID/OR/M7','M2G','BAR','PEDI ENDO','Other'];
const STATUSES = ['Data','Adjudication','Dispensing','Pre-Ver','Verification','FOA','Special Order','Rph Needed','Bagged/AVS Good','Waiting on ONE!','Meds To Go','In the Works','In the Works !!!','Verified','Problem/Issue','Next Day d/c','No d/c Yet','Need to Type','Payment Issue'];
const DELIVERY_OPTS = ['In the Works','In the Works !!!','Verified','Bagged/AVS Good','Waiting on ONE!','Meds To Go','Problem/Issue','Next Day d/c','No d/c Yet','Need to Type','Payment Issue','In Transit','Delivered'];
const DELIVERERS = ['Anil','Brie','Cassie','Carly','Devon','Devynn','Dj','Elaina','Heather','Jason','Jen','Jillian','John','K-Rae','Kate','Kathleen','Kavita','KB','Lauren','Levi','Lihan','Mari','Ryo','Sam','Stefania','Vo'];

const STATUS_COLORS = {
  'Data':['#639922','#eaf3de'],'Adjudication':['#BA7517','#FAEEDA'],
  'Dispensing':['#185fa5','#e6f1fb'],'Pre-Ver':['#1D9E75','#E1F5EE'],
  'Verification':['#0F6E56','#E1F5EE'],'FOA':['#853f99','#EEEDFE'],
  'Special Order':['#533c89','#EEEDFE'],'Rph Needed':['#3c34aa','#EEEDFE'],
  'Bagged/AVS Good':['#3B6D11','#C0DD97'],'Waiting on ONE!':['#BA7517','#FAC775'],
  'Meds To Go':['#185fa5','#B5D4F4'],'In the Works':['#185fa5','#e6f1fb'],
  'In the Works !!!':['#A32D2D','#FCEBEB'],'Verified':['#0F6E56','#E1F5EE'],
  'Problem/Issue':['#A32D2D','#FCEBEB'],'Next Day d/c':['#5F5E5A','#F1EFE8'],
  'No d/c Yet':['#5F5E5A','#e0dedb'],'Need to Type':['#993556','#FBEAF0'],
  'Payment Issue':['#D85A30','#FAECE7'],'In Transit':['#185fa5','#B5D4F4'],
  'Delivered':['#3B6D11','#EAF3DE']
};
const CALLED_COLORS = {
  'YES':['#3B6D11','#EAF3DE'],
  'NO':['#A32D2D','#FCEBEB'],
  'ATTEMPTED':['#BA7517','#FAEEDA']
};

let patients = [];
let editId = null;
let activeFloor = 'All';
let activeStatus = 'All';
let activeCalled = 'All';

function saveData() { try { localStorage.setItem('m2b_patients', JSON.stringify(patients)); } catch(e){} }
function loadData() {
  try {
    const d = localStorage.getItem('m2b_patients');
    if (d) patients = JSON.parse(d);
  } catch(e) {}
  if (!patients.length) {
    patients = [
      {id:uid(),name:'Simpson, Bruce',floor:'Miller 3',called:'NO',status:'Next Day d/c',delivery:'Next Day d/c',deliverer:'',notes:'Sunday d/c',ts:Date.now()},
      {id:uid(),name:'Holve, Brad',floor:'Miller 3',called:'ATTEMPTED',status:'Next Day d/c',delivery:'Next Day d/c',deliverer:'',notes:'Saturday',ts:Date.now()},
      {id:uid(),name:'Fox, Hap',floor:'Miller 4',called:'NO',status:'Next Day d/c',delivery:'Next Day d/c',deliverer:'',notes:'PT tends to leave without meds FYI',ts:Date.now()},
      {id:uid(),name:'Mara, Kevin',floor:'Miller 5',called:'YES',status:'Next Day d/c',delivery:'Next Day d/c',deliverer:'',notes:'Sunday',ts:Date.now()},
      {id:uid(),name:'Mumford, Gator',floor:'McClure 5',called:'NO',status:'Next Day d/c',delivery:'Next Day d/c',deliverer:'',notes:'Hospice d/c Saturday 4/25',ts:Date.now()},
      {id:uid(),name:'Philippakis',floor:'McClure 6',called:'YES',status:'Next Day d/c',delivery:'Next Day d/c',deliverer:'',notes:'d/c postponed until 4/25',ts:Date.now()},
      {id:uid(),name:'Daniel Aldridge 4/28/86',floor:'Shep',called:'NO',status:'Problem/Issue',delivery:'Problem/Issue',deliverer:'',notes:'CONSULT SAM ON DISCHARGE EVEN ON WEEKEND',ts:Date.now()},
      {id:uid(),name:'Berglund, Wayne 10/15/1946',floor:'BAR',called:'NO',status:'Data',delivery:'In the Works',deliverer:'',notes:'wants receipt, $226.34 on 3/6',ts:Date.now()},
      {id:uid(),name:'Gerding, Nichole 11/19/80',floor:'ED',called:'NO',status:'Verification',delivery:'In the Works',deliverer:'',notes:'dilaudid',ts:Date.now()},
    ];
    saveData();
  }
}

function uid() { return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

function updateClock() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent = now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const h = now.getHours();
  const shift = h < 7 ? 'Night Shift' : h < 15 ? 'Day Shift' : h < 23 ? 'Evening Shift' : 'Night Shift';
  document.getElementById('shiftBadge').textContent = shift;
}
setInterval(updateClock, 1000);
updateClock();

function populateSelects() {
  document.getElementById('mFloor').innerHTML = FLOORS.map(f=>`<option>${f}</option>`).join('');
  document.getElementById('mStatus').innerHTML = `<option value="">— Select —</option>`+STATUSES.map(s=>`<option>${s}</option>`).join('');
  document.getElementById('mDelivery').innerHTML = `<option value="">— Select —</option>`+DELIVERY_OPTS.map(s=>`<option>${s}</option>`).join('');
  document.getElementById('mDeliverer').innerHTML = `<option value="">— Select —</option>`+DELIVERERS.map(d=>`<option>${d}</option>`).join('');
}

function renderFloorSidebar() {
  const counts = {};
  patients.forEach(p => { counts[p.floor] = (counts[p.floor]||0)+1; });
  const usedFloors = FLOORS.filter(f => counts[f]);
  document.getElementById('floorButtons').innerHTML = usedFloors.map(f=>`
    <button class="floor-btn${activeFloor===f?' active':''}" onclick="setFloor('${f}',this)">
      ${f} <span class="floor-count">${counts[f]||0}</span>
    </button>`).join('');
  document.getElementById('fcAll').textContent = patients.length;
}

function setFloor(floor, btn) {
  activeFloor = floor;
  document.querySelectorAll('.floor-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function setStatusFilter(status, btn) {
  activeStatus = status;
  activeCalled = 'All';
  document.querySelectorAll('.filter-btn[data-status]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.filter-btn[data-called]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function setCalledFilter(called, btn) {
  activeCalled = called;
  activeStatus = 'All';
  document.querySelectorAll('.filter-btn[data-status]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.filter-btn[data-called]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return patients.filter(p => {
    if (activeFloor !== 'All' && p.floor !== activeFloor) return false;
    if (activeStatus !== 'All' && p.status !== activeStatus) return false;
    if (activeCalled !== 'All' && p.called !== activeCalled) return false;
    if (q && !`${p.name} ${p.floor} ${p.notes} ${p.status}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function inlineUpdate(selectId) {
  const el = document.getElementById(selectId);
  if (!el) return;
  const parts = selectId.split('__');
  const pid = parts[0];
  const field = parts[1];
  const p = patients.find(x=>x.id===pid);
  if (!p) return;
  p[field] = el.value;
  let colorMap = {};
  if (field==='status'||field==='delivery') colorMap = STATUS_COLORS;
  if (field==='called') colorMap = CALLED_COLORS;
  const [fg,bg] = colorMap[el.value]||['#5F5E5A','#F1EFE8'];
  el.style.background = bg;
  el.style.color = fg;
  saveData();
  updateSummary();
  toast('Saved');
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  document.getElementById('tableCount').textContent = `${filtered.length} patient${filtered.length!==1?'s':''}`;
  if (!filtered.length) { tbody.innerHTML=''; emptyState.style.display=''; return; }
  emptyState.style.display = 'none';
  let rows = '';
  if (activeFloor==='All') {
    const byFloor = {};
    filtered.forEach(p=>{ (byFloor[p.floor]=byFloor[p.floor]||[]).push(p); });
    FLOORS.filter(f=>byFloor[f]).forEach(f=>{
      rows += `<tr><td colspan="8" class="floor-group-header">${f}</td></tr>`;
      byFloor[f].forEach(p=>{ rows+=patientRow(p); });
    });
  } else {
    filtered.forEach(p=>{ rows+=patientRow(p); });
  }
  tbody.innerHTML = rows;
  updateSummary();
  renderFloorSidebar();
}

function patientRow(p) {
  const sc = STATUS_COLORS[p.status]||['#5F5E5A','#F1EFE8'];
  const cc = CALLED_COLORS[p.called]||['#5F5E5A','#F1EFE8'];
  const dc = STATUS_COLORS[p.delivery]||['#5F5E5A','#F1EFE8'];
  const statusSel = `<select class="editable-select badge" style="background:${sc[1]};color:${sc[0]}" id="${p.id}__status" onchange="inlineUpdate('${p.id}__status')">${STATUSES.map(s=>`<option${s===p.status?' selected':''}>${s}</option>`).join('')}</select>`;
  const calledSel = `<select class="editable-select badge" style="background:${cc[1]};color:${cc[0]}" id="${p.id}__called" onchange="inlineUpdate('${p.id}__called')"><option value="">—</option>${['YES','NO','ATTEMPTED'].map(s=>`<option${s===p.called?' selected':''}>${s}</option>`).join('')}</select>`;
  const deliverySel = `<select class="editable-select badge" style="background:${dc[1]};color:${dc[0]}" id="${p.id}__delivery" onchange="inlineUpdate('${p.id}__delivery')"><option value="">—</option>${DELIVERY_OPTS.map(s=>`<option${s===p.delivery?' selected':''}>${s}</option>`).join('')}</select>`;
  const delivererSel = `<select class="editable-select" id="${p.id}__deliverer" onchange="inlineUpdate('${p.id}__deliverer')"><option value="">—</option>${DELIVERERS.map(d=>`<option${d===p.deliverer?' selected':''}>${d}</option>`).join('')}</select>`;
  const noteClass = p.notes&&p.notes===p.notes.toUpperCase()&&p.notes.length>3 ? 'note-text note-alert' : 'note-text';
  return `<tr>
    <td class="col-patient"><div class="patient-name">${esc(p.name)}</div></td>
    <td class="col-floor" style="font-size:12px;color:var(--clr-muted)">${esc(p.floor)}</td>
    <td class="col-called">${calledSel}</td>
    <td class="col-status">${statusSel}</td>
    <td class="col-delivery">${deliverySel}</td>
    <td class="col-deliverer">${delivererSel}</td>
    <td class="col-notes"><span class="${noteClass}" title="${esc(p.notes)}">${esc(p.notes)}</span></td>
    <td class="col-actions">
      <button class="action-btn" onclick="openEditModal('${p.id}')" title="Edit">✏️</button>
      <button class="action-btn danger" onclick="deletePatient('${p.id}')" title="Remove">✕</button>
    </td>
  </tr>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateSummary() {
  const total = patients.length;
  const delivered = patients.filter(p=>p.delivery==='Delivered').length;
  const problem = patients.filter(p=>p.status==='Problem/Issue'||p.status==='In the Works !!!').length;
  const nextday = patients.filter(p=>p.status==='Next Day d/c').length;
  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumInProgress').textContent = Math.max(0, total-delivered-nextday);
  document.getElementById('sumDelivered').textContent = delivered;
  document.getElementById('sumProblem').textContent = problem;
  document.getElementById('sumNextDay').textContent = nextday;
}

function openAddModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Add Patient';
  ['mName','mNotes'].forEach(id=>document.getElementById(id).value='');
  ['mFloor','mCalled','mStatus','mDelivery','mDeliverer'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=el.options[0].value; });
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal(id) {
  const p = patients.find(x=>x.id===id);
  if (!p) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Edit Patient';
  document.getElementById('mName').value = p.name;
  document.getElementById('mFloor').value = p.floor;
  document.getElementById('mCalled').value = p.called;
  document.getElementById('mStatus').value = p.status;
  document.getElementById('mDelivery').value = p.delivery;
  document.getElementById('mDeliverer').value = p.deliverer;
  document.getElementById('mNotes').value = p.notes;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function savePatient() {
  const name = document.getElementById('mName').value.trim();
  if (!name) { alert('Patient name is required.'); return; }
  const data = {
    name,
    floor: document.getElementById('mFloor').value,
    called: document.getElementById('mCalled').value,
    status: document.getElementById('mStatus').value,
    delivery: document.getElementById('mDelivery').value,
    deliverer: document.getElementById('mDeliverer').value,
    notes: document.getElementById('mNotes').value.trim(),
  };
  if (editId) {
    const idx = patients.findIndex(x=>x.id===editId);
    if (idx>=0) patients[idx] = {...patients[idx],...data};
  } else {
    patients.unshift({id:uid(),ts:Date.now(),...data});
  }
  saveData();
  renderAll();
  closeModal();
  toast(editId ? 'Patient updated' : 'Patient added');
}

function deletePatient(id) {
  if (!confirm('Remove this patient from the board?')) return;
  patients = patients.filter(x=>x.id!==id);
  saveData();
  renderAll();
  toast('Patient removed');
}

function exportCSV() {
  const cols = ['Name','Floor','Called','Status','Delivery','Deliverer','Notes'];
  const rows = patients.map(p=>[p.name,p.floor,p.called,p.status,p.delivery,p.deliverer,p.notes].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','));
  const csv = [cols.join(','),...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download = `meds2beds_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}

function renderAll() { renderFloorSidebar(); renderTable(); updateSummary(); }

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target===this) closeModal();
});

loadData();
populateSelects();
renderAll();
</script>
</body>
</html>
